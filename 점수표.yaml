# ============================================================
#  공고명 기반 점수표
#
#  메모장으로 열어서 고치면 됩니다. 코드는 건드릴 필요 없습니다.
#  고친 뒤에는 반드시 점수표_검증.py 를 돌려서 검증용 공고 8건이
#  여전히 잡히는지 확인하세요.
#
#  점수 계산 순서
#    1. 거부권 검사   → 걸리면 0점 (단 core/market 있으면 무효)
#    2. core   8점씩  (최대 3개)
#    3. market 8점
#    4. target 2점씩  (최대 2개)
#    5. action 2점씩  (최대 2개)
#    6. target 와 action 이 둘 다 있으면 +4
#    7. core/market 도 없고 target+action 조합도 없으면 → 3점으로 깎음
#    8. 기관 가점 +3 / +2
#    9. kill_hard -12씩,  kill_soft -5씩
# ============================================================

# 13점 이상 자동수집(A·B) / 7~12점 검토 필요(C) / 7점 미만 버림
cut_collect: 13
cut_review: 7

# 연기금·공제회 공고에만 적용하는 낮은 검토 문턱.
# config.yaml 의 institutions_low_cut 에 걸리는 기관은 5점부터 C로 올린다.
#
# 이 기관들은 '자산운용 컨설팅' '기준 포트폴리오 도입' 처럼 확정어가 없어
# 5~6점에 머무는 공고가 실제로 우리 일인 경우가 있다. 4개월 14건이었다.
# 반대로 금융공공기관까지 넓히면 4개월 77건이 되고 그 대부분이
# 뉴스 모니터링·장비 교체·감정평가처럼 무관한 공고다. 그래서 범위를 좁혔다.
cut_review_low: 5

# ------------------------------------------------------------
#  core ─ 평가 확정어 (8점)
#
#  이 표현이 제목에 있으면 채권평가회사 업무로 본다.
#  거부권(아래 selectee)도 무효화한다.
#
#  검증용 PDF 8건의 '입찰참가자격' 원문에서 실제로 확인된 표현과
#  자본시장법상 채권평가회사 고유 업무를 넣었다.
# ------------------------------------------------------------
core:
  # --- PDF 원문에서 확인됨 ---
  - 채권평가회사
  - 집합투자기구평가회사
  - 집합투자기구 평가회사
  - 자산평가회사
  - 집합투자재산
  - 공정가치평가
  - 공정가치
  - 시가평가
  - 채권평가
  - 자산평가
  - 금융자산평가
  - 평가가격
  - 채권평가정보
  # --- 기준가격 계열 ---
  - 평가기준가
  - 기준가격
  - 시가평가기준
  - 가격정보제공
  - 정보제공기관
  # --- 자본시장법상 고유 업무 (아직 실사례는 없지만 나올 수 있음) ---
  - 수익률곡선
  - 금리기간구조
  - 신용스프레드
  - 채권지수

# ------------------------------------------------------------
#  market ─ 채권시장 제도·연구 (8점)
#
#  '평가' 같은 행위어가 없어도 우리 영역인 주제들.
#  한국예탁결제원 '장외 채권거래 등 이행방안 수립 연구용역' 이
#  여기 걸린다. 이 항목이 없으면 그 건을 놓친다.
# ------------------------------------------------------------
market:
  - 장외채권
  - 채권거래
  - 채권시장
  - 채권발행
  - 채권유통
  - 채권결제
  - 회사채시장
  - 국채시장
  - 채권호가
  - 채권중개

# ------------------------------------------------------------
#  strategy ─ 자산운용 전략·자문 (6점)
#
#  평가 확정어도 채권시장 주제도 아니지만, 연기금·공제회가 내는
#  자산운용 자문 성격의 용역. '자산배분' 은 target 에도 있어 2점을
#  받지만, 행위어가 없어 조합(+4)이 성립하지 않고 3점 상한에 걸려
#  5점에 머문다. 그래서 문턱이 7점인 기관에서는 전부 버려졌다.
#
#  실측(2026-02-13~08-12 전국 294,002건)에서 아래 표현이 걸린 공고는
#  8건뿐이고 전부 우리 고객 기관 건이었다. 오탐이 없다.
#    건설근로자공제회 기준 포트폴리오 도입(3회)
#    한국지방재정공제회 자산운용 컨설팅(2회)
#    우정사업본부 우체국예금 전략·전술 자산배분 체계 개선(2회)
#    새마을금고복지회 자금운용 중장기 자산배분과 체계화 컨설팅
#
#  8점(core/market)이 아니라 6점인 이유: 확정 평가 업무가 아니라
#  자문 성격이라 '자동수집' 이 아니라 '검토' 로 올리는 것이 맞다.
#  거부권(selectee)도 무효화하지 않는다. '자산배분' 이 들어갔다고
#  '위탁운용사 선정' 같은 입찰 불가 건을 살려내면 안 된다.
# ------------------------------------------------------------
strategy:
  - 자산배분
  - 자산운용전략
  - 자산운용 전략
  - 기준포트폴리오
  - 기준 포트폴리오
  - 자산운용 컨설팅
  - 자산운용컨설팅
  - 자금운용 컨설팅
  - 자금운용컨설팅

