# ------------------------------------------------------------
#  거부권 ─ 우리가 '뽑히는 쪽'이 아닌 공고
#
#  '위탁운용사 선정' 은 운용사를 뽑는 공고라 채권평가회사가 입찰할 수
#  없다. 반면 '위탁운용사 선정 정량평가 용역' 은 그 평가를 대행하는
#  거라 우리 일이다. 같은 '위탁운용사'인데 정반대다.
#  단어 목록만으로는 절대 구분되지 않아서 규칙으로 뺐다.
#
#  selectee 에 걸리고 delegate 가 하나도 없으면 → 0점
#  단, core 나 market 이 있으면 이 규칙은 무효 (평가 용역이 확실하므로
#  '채권 시가평가 정보제공 사업자 선정' 같은 제목을 잘못 죽이지 않는다)
# ------------------------------------------------------------
