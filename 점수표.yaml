  - 매각자문사
  - 사업자 선정
  - 사업자 추가선정
  - 회계법인 선정
  - 신용평가회사 선정

# 이게 있으면 '평가를 대행하는 용역' 이므로 거부권을 쓰지 않는다.
# 주의: 맨 '평가' 를 넣으면 안 된다. '신용평가회사 선정' 처럼 기관
#       이름 안에 들어간 '평가' 까지 걸려서 규칙이 무력해진다.
