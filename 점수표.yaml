# ------------------------------------------------------------
#  기관 가점
#  config.yaml 의 institutions 목록에 걸리면 +3.
#  아래 보강 목록에 걸리면 +2.
#
#  보강 목록은 기존 institutions 에 없어서 놓치던 기금 운용기관들이다.
#  (한국벤처투자 모태펀드 운용성과평가, 전파진흥원 기금 자산운용
#   성과평가 등이 이것 때문에 4개월간 한 건도 안 잡혔다)
# ------------------------------------------------------------
