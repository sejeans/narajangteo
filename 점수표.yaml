# ------------------------------------------------------------
#  PDF 본문에서 찾을 키워드 (3차 단계)
#
#  검증용 PDF 8건을 열어보니 '채권평가회사' 만 찾아서는 부족했다.
#  자격요건은 대개 아래처럼 여러 업종을 나열하는 형태로 쓰여 있다.
#
#    - 「자본시장과 금융투자업에 관한 법률」 제263조에 따른 채권평가회사
#    - 집합투자기구평가회사(업종코드 : 3864)
#    - 회계법인(업종코드 : 1200)
#
#  즉 3864(집합투자기구평가회사)가 같이 적힌 공고는 우리도 대상이다.
# ------------------------------------------------------------
pdf_strong:
  - 채권평가회사
  - '3865'
  - 집합투자기구평가회사
  - 집합투자기구 평가회사
  - 자산평가회사
  - '3864'
  - 제263조
  - 집합투자재산 평가
  - 시가평가
