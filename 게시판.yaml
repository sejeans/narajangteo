# 기관 자체 홈페이지 게시판 목록
#
# 나라장터에 안 올라오는 공고를 기관 홈페이지에서 직접 읽습니다.
# 파이썬을 열지 않고 이 파일만 고쳐 게시판을 늘리거나 끌 수 있습니다.
#
# 여기서 온 공고는 무조건 'C 검토' 로만 올라갑니다.
# 면허제한 업종코드도 첨부 공고문도 없어 제목 점수만으로 판정하기 때문입니다.
#
# 게시판 주소를 찾아 둔 곳: 요구사항/기관_입찰공고_페이지.md
#
# 확인해 보려면 (수집도 메일도 하지 않습니다)
#     python 게시판.py                   켜둔 곳 전부
#     python 게시판.py 중소기업중앙회      한 곳만 (꺼둔 곳도 강제로)
#
# 항목 뜻
#   이름      로그와 조회기록에 남는 이름
#   기관      엑셀의 '수요기관' 칸에 그대로 들어간다. 나라장터 건과 짝지을 때
#             같은 기관인지 보는 기준이기도 하다
#   사용      false 로 두면 건너뛴다
#   목록      목록 첫 장 주소. 한 번에 한 장만 읽는다
#   보냄      목록을 주소로는 안 주고 양식을 보내야 주는 곳에만 적는다.
#             적으면 그 값들을 담아 POST 로 부른다 (한국지방재정공제회)
#   목록보기  사람이 열어 볼 목록 화면. 위 '목록' 이 사람이 볼 화면이
#             아닐 때만 적는다. 상세 주소를 못 만들면 여기로 링크한다
#   상세      글 하나의 주소. {번호} 자리에 번호찾기로 뽑은 값이 들어간다.
#             비워두면 목록(또는 목록보기) 주소로 링크한다
#   기관찾기  제목에서 수요기관을 뽑는 정규식(첫 괄호). 다른 기관 공고를
#             대신 실어 주는 게시판에만 쓴다 (금융투자협회).
#             못 뽑으면 위 '기관' 을 그대로 쓴다
#   번호찾기  목록 줄의 링크에서 글 번호를 뽑는 정규식. 첫 괄호가 번호다.
#             (?P<이름>...) 로 이름을 붙이면 상세 주소에 {이름} 으로 쓸 수 있다.
#             ※ 역슬래시는 두 번 적습니다 ("\\d+"). YAML 규칙입니다
#   행태그    목록 한 줄이 무슨 태그인가. 기본 tr. <li> 로 그리는 곳은 li
#   칸태그    그 줄 안에서 칸이 무슨 태그인가. 기본 td,th. li 게시판은 보통 div.
#             행태그를 여기에도 적으면(예: 행태그 li · 칸태그 "div,li")
#             줄 안에 또 나온 같은 태그를 새 줄이 아니라 칸으로 읽는다
#   제목칸    한 줄에서 제목이 몇 번째 칸인가 (0 부터. 음수는 뒤에서부터)
#   날짜칸    등록일이 몇 번째 칸인가. 대개 뒤에서 두 번째라 -2
#   마감칸    마감일시가 목록에 나오는 드문 게시판에만 적는다. 안 적으면 빈칸
#   제목제외  이 낱말이 든 글은 버린다 (정규식)
#   제목포함  적어두면 이 중 하나라도 든 글만 남긴다. 공지사항에 입찰공고가
#             섞여 있는 게시판(3단계)에서 씁니다

# ------------------------------------------------------------
#  설정 — 게시판 전체에 걸리는 것
# ------------------------------------------------------------
설정:
  # 서버 인증서를 어떻게 검사할까.
  #   자동          윈도우에 설치된 인증서로 검사합니다. 사내 망에 SSL 을
  #                 가로채는 장비(ePrism 등)가 있어도 그 장비의 루트 인증서가
  #                 회사 PC 에 깔려 있으면 그대로 됩니다. 보통 이대로 두세요.
  #   '파일.pem'    자동으로 안 되면, 그 장비의 루트 인증서를 내보내 이 폴더에
  #                 두고 파일 이름을 적으세요. 전산팀에 "사내 SSL 검사 장비의
  #                 루트 인증서 PEM" 이라고 하면 받을 수 있습니다.
  #   false         검사하지 않습니다. 마지막 수단입니다. 읽기만 하는 공개
  #                 게시판이라 넘기는 값은 없지만, 받아온 내용이 진짜 그
  #                 사이트 것인지 보증할 수 없게 됩니다.
  인증서: 자동


게시판:

  # ---- 1단계 ------------------------------------------------------------
  # 나라장터 27건 중 검토 등급이 0건인데 자체 사이트에만 3건이 있었다.
  # 채널이 갈린 것이지 표본 오차가 아니다.
  - 이름: 중소기업중앙회
    기관: 중소기업중앙회
    사용: true
    목록: "https://www.kbiz.or.kr/ko/contents/bbs/list.do?mnSeq=211&pg=1&pgSz=30"
    # goView(163784, 'N') 에서 번호와 '공지 고정' 표시를 둘 다 뽑는다.
    # 공지로 고정된 글은 topFixYn=Y 로 열어야 하고, N 으로 열면 목록으로 튕긴다.
    상세: "https://www.kbiz.or.kr/ko/contents/bbs/view.do?seq={번호}&topFixYn={고정}&mnSeq=211"
    번호찾기: "goView\\((?P<번호>\\d+),\\s*'(?P<고정>[YN])'"
    제목칸: 1
    날짜칸: -1
    # 이 게시판은 입찰공고와 그 결과가 한 곳에 섞여 올라온다.
    # 결과는 이미 끝난 건이라 우리가 할 일이 없다.
    제목제외:
      - "평가\\s*결과"
      - "선정\\s*결과"
      - "심사\\s*결과"
      - "낙찰"
      - "유찰"
      - "결과\\s*공고"

  # ---- 2단계 · 입찰공고 전용 게시판 --------------------------------------
  # 목록이 곧 입찰공고라 제목 필터가 거의 필요 없는 곳들이다.

  - 이름: 과학기술인공제회
    기관: 과학기술인공제회
    사용: true
    목록: "https://www.sema.or.kr/sema/bbs/B0000024/list.do?menuNo=200018"
    상세: "https://www.sema.or.kr/sema/bbs/B0000024/view.do?nttId={번호}&menuNo=200018"
    # 같은 주소에 menuNo 도 있어서 'nttId' 를 이름으로 못 박는다.
    번호찾기: "nttId=(?P<번호>\\d+)"
    제목칸: 1
    날짜칸: -2

  - 이름: 경찰공제회
    기관: 경찰공제회
    사용: true
    목록: "https://www.pmaa.or.kr/www/1461128463820/bbs.do"
    상세: "https://www.pmaa.or.kr/www/1461128463820/bbs.do?type=view&bbsIdx={번호}"
    번호찾기: "fn_view\\('(?P<번호>\\d+)'"
    제목칸: 1
    날짜칸: -2

  - 이름: 대한소방공제회
    기관: 대한소방공제회
    사용: true
    목록: "https://www.focu.or.kr/1/board/9/list.do"
    상세: "https://www.focu.or.kr/1/board/9/view.do?idx={번호}"
    번호찾기: "idx=(?P<번호>\\d+)"
    제목칸: 1
    날짜칸: -2
    # 끝난 건은 제목 앞에 [완료] 를 달아 그대로 둔다. 우리가 할 일이 없다.
    제목제외:
      - "\\[완료\\]"

  - 이름: 건설근로자공제회
    기관: 건설근로자공제회
    사용: true
    목록: "https://www.cw.or.kr/board.do?boardConfigNo=29&menuNo=209&boardCategoryNo=19&pageNo=1"
    상세: "https://www.cw.or.kr/board.do?boardConfigNo=29&menuNo=209&action=view&boardNo={번호}&pageNo=1"
    # goView('29','209','view','34417') 의 네 번째가 글 번호다.
    번호찾기: "goView\\('\\d+','\\d+','view','(?P<번호>\\d+)'"
    제목칸: 2
    날짜칸: -2

  - 이름: 공무원연금공단
    기관: 공무원연금공단
    사용: true
    목록: "https://www.geps.or.kr/notiCommunication_bidContract"
    상세: "https://www.geps.or.kr/notiCommunication_bidContract/{번호}"
    번호찾기: "notiCommunication_bidContract/(?P<번호>\\d+)"
    제목칸: 2
    날짜칸: -2

  - 이름: 국민연금공단
    기관: 국민연금공단
    사용: true
    목록: "https://www.nps.or.kr/pnsgdnc/bidgdnc/getOHAE0016M0List.do?menuId=MN24000977"
    상세: "https://www.nps.or.kr/pnsgdnc/bidgdnc/getOHAE0016M1.do?menuId=MN24000977&pstId={번호}&hmpgCd=01&hmpgBbsCd=BS20240014"
    # 글 번호가 숫자가 아니라 ZZ2026000... 꼴이다.
    번호찾기: "pstId=(?P<번호>[A-Z0-9]+)"
    제목칸: 1
    날짜칸: -3

  # 나라장터에 안 올라오는 별도 채널이고 우리 업무와 가장 가깝다.
  # 위 국민연금공단(본사)과는 다른 게시판이라 따로 둔다.
  - 이름: 국민연금 기금운용본부
    기관: 국민연금공단
    사용: true
    목록: "https://fund.nps.or.kr/impa/dlnginstslctnpbanclist/getOHEF0017M0.do"
    상세: "https://fund.nps.or.kr/impa/dlnginstslctnpbancdtl/getOHEF0018M0.do?pstId={번호}&hmpgBbsCd=BS20240066"
    번호찾기: "fnc_goBbsDetail\\('(?P<번호>[A-Z0-9]+)'"
    제목칸: 1
    날짜칸: -2
    # 선정 공고와 그 결과가 한 곳에 섞여 올라온다. '해외 수탁기관 선정' 처럼
    # 맨 '선정' 은 남기고 '선정결과'·'결과 공고' 만 뺀다.
    제목제외:
      - "선정\\s*결과"
      - "평가\\s*결과"
      - "결과\\s*공고"

  - 이름: 새마을금고중앙회
    기관: 새마을금고중앙회
    사용: true
    목록: "https://www.kfcc.co.kr/noticeofTender/noticeofTenderList.do"
    # 상세가 POST 로만 열린다 (GET 은 400). 링크는 목록으로 보낸다.
    상세: ""
    번호찾기: "fnDetail\\('(?P<번호>\\d+)'"
    # 표가 아니라 <li> 안에 <div> 를 늘어놓는다.
    행태그: "li"
    칸태그: "div"
    제목칸: 0
    날짜칸: -1

  - 이름: 새마을금고복지회
    기관: 새마을금고복지회
    사용: true
    목록: "https://www.kccwf.or.kr/nkcc/kccwf_home/cs/hbc0033/select03.do"
    # 상세를 여는 goPage() 가 바깥 스크립트에 있어 주소를 못 만든다.
    상세: ""
    # 글 번호가 BSN20260616244808 · _MG20260507000250 처럼 섞여 있다.
    번호찾기: "goPage\\('(?P<번호>[A-Za-z0-9_]+)'"
    제목칸: 1
    날짜칸: -2

  - 이름: 국민건강보험공단
    기관: 국민건강보험공단
    사용: true
    목록: "https://www.nhis.or.kr/nhis/together/wbhaea02200m01.do"
    상세: "https://www.nhis.or.kr/nhis/together/wbhaea02200m01.do?mode=view&articleNo={번호}"
    번호찾기: "articleNo=(?P<번호>\\d+)"
    제목칸: 1
    날짜칸: -3
    # 공고와 그 평가 결과가 한 게시판에 섞여 올라온다.
    제목제외:
      - "결과\\s*공개"
      - "결과\\s*공고"
      - "선정\\s*결과"
      - "낙찰"

  - 이름: 우체국금융개발원
    기관: 우체국금융개발원
    사용: true
    목록: "https://www.posid.or.kr/cyberpr/bidding_list.do"
    # 상세가 POST 로만 열린다. 링크는 목록으로 보낸다.
    상세: ""
    번호찾기: "fn_borad_select\\('bidding','(?P<번호>\\d+)'"
    제목칸: 1
    # 칸이 번호·입찰품목·담당자·입찰개시일·입찰종료일·다운로드·조회수 다.
    # 마감일시가 목록에 있는 드문 게시판이라 그것도 가져온다.
    날짜칸: 3
    마감칸: 4
    # 낙찰자가 정해진 뒤 올리는 글이라 우리가 할 일이 없다.
    제목제외:
      - "우선협상대상자"

  - 이름: 한국해양진흥공사
    기관: 한국해양진흥공사
    사용: true
    목록: "https://www.kobc.or.kr/ebz/kor/bbs/list.do?ptIdx=264&mId=0603000000"
    # goTo.view() 가 바깥 스크립트에 있어 상세 주소를 못 만든다.
    상세: ""
    번호찾기: "goTo\\.view\\('view','(?P<번호>\\d+)'"
    제목칸: 1
    날짜칸: -2

  - 이름: 코스콤
    기관: 코스콤
    사용: true
    목록: "https://www.koscom.co.kr/portal/bbs/B0000002/list.do?menuNo=200453"
    상세: "https://www.koscom.co.kr/portal/bbs/B0000002/view.do?nttId={번호}&menuNo=200453"
    번호찾기: "nttId=(?P<번호>\\d+)"
    제목칸: 1
    날짜칸: -2

  # 자체 게시판은 유동화보증 업무 전용이라 잡히는 것이 그 업무뿐이다.
  # 일반 조달은 신보 홈페이지도 ALIO 로 넘기므로 나라장터로 계속 본다.
  # 2026-08-20 현재 이 게시판은 비어 있다. 그래도 켜 둔다 — 나라장터에
  # 안 올라오는 채널이고, 지난 분기에 없었다고 다음 분기에도 없는 것은 아니다.
  - 이름: 신용보증기금
    기관: 신용보증기금
    사용: true
    목록: "https://www.kodit.or.kr/kodit/na/ntt/selectNttList.do?mi=5019&bbsId=2021"
    상세: ""
    번호찾기: "nttSn=(?P<번호>\\d+)"
    제목칸: 1
    날짜칸: -2

  # ---- 목록을 JSON 으로 주는 곳 ------------------------------------------
  # 화면은 자바스크립트가 그려서 <table> 이 아예 없다. 대신 목록 자료를
  # JSON 으로 주므로 그걸 바로 읽는다. 그림을 흉내 내는 것보다 튼튼하다.

  - 이름: 한국예탁결제원
    기관: 한국예탁결제원
    사용: true
    # 화면 주소는 /ko/about-ksd/ksd-news/bid-notice 이고, 그 화면이 부르는
    # 목록 API 가 이것이다. menuId 가 '입찰공고' 게시판을 가리킨다.
    # pagingYn=Y 를 빼면 게시판 전체(1,000건 넘음)를 한꺼번에 준다.
    # 넣으면 한 장 10건이다. 한 달에 몇 건뿐인 게시판이라 그것으로 충분하다.
    목록: "https://www.ksd.or.kr/ko/api/content?menuId=KR_ABT_070300&pagingYn=Y&pageIndex=1"
    상세: "https://www.ksd.or.kr/ko/about-ksd/ksd-news/bid-notice/{번호}"
    방식: json
    json경로: "body.list"
    번호키: nttId
    제목키: bbsSj
    # 20260803134608 처럼 붙여 쓴 날짜다.
    날짜키: frstRegistPnttm

  - 이름: 대한지방행정공제회
    기관: 대한지방행정공제회
    사용: true
    목록: "https://www.poba.or.kr/bbs/selectNttList?sechBbsSeq=11"
    상세: "https://www.poba.or.kr/bbs/selectNttDetail?sechBbsSeq=11&sechBbstSeq={번호}"
