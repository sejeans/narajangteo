# 기관 자체 홈페이지 게시판 목록
#
# 나라장터에 안 올라오는 공고를 기관 홈페이지에서 직접 읽습니다.
# 파이썬을 열지 않고 이 파일만 고쳐 게시판을 늘리거나 끌 수 있습니다.
#
# 여기서 온 공고는 무조건 'C 검토' 로만 올라갑니다.
# 면허제한 업종코드도 첨부 공고문도 없어 제목 점수만으로 판정하기 때문입니다.
#
# 게시판 주소를 찾아 둔 곳: 요구사항/기관_입찰공고_페이지.md
#
# 확인해 보려면 (수집도 메일도 하지 않습니다)
#     python 게시판.py                   켜둔 곳 전부
#     python 게시판.py 중소기업중앙회      한 곳만 (꺼둔 곳도 강제로)
#
# 항목 뜻
#   이름      로그와 조회기록에 남는 이름
#   기관      엑셀의 '수요기관' 칸에 그대로 들어간다. 나라장터 건과 짝지을 때
#             같은 기관인지 보는 기준이기도 하다
#   사용      false 로 두면 건너뛴다
#   목록      목록 첫 장 주소. 한 번에 한 장만 읽는다
#   상세      글 하나의 주소. {번호} 자리에 번호찾기로 뽑은 값이 들어간다
#   번호찾기  목록 줄의 링크에서 글 번호를 뽑는 정규식. 첫 괄호가 번호다.
#             (?P<이름>...) 로 이름을 붙이면 상세 주소에 {이름} 으로 쓸 수 있다
#   제목칸    한 줄에서 제목이 몇 번째 칸인가 (0 부터. 음수는 뒤에서부터)
#   날짜칸    등록일이 몇 번째 칸인가. 대개 맨 뒤라 -1
#   제목제외  이 낱말이 든 글은 버린다 (정규식)
#   제목포함  적어두면 이 중 하나라도 든 글만 남긴다. 공지사항에 입찰공고가
#             섞여 있는 게시판(3단계)에서 쓴다

# ------------------------------------------------------------
#  설정 — 게시판 전체에 걸리는 것
# ------------------------------------------------------------
설정:
  # 서버 인증서를 어떻게 검사할까.
  #   자동          윈도우에 설치된 인증서로 검사합니다. 사내 망에 SSL 을
  #                 가로채는 장비(ePrism 등)가 있어도 그 장비의 루트 인증서가
  #                 회사 PC 에 깔려 있으면 그대로 됩니다. 보통 이대로 두세요.
  #   '파일.pem'    자동으로 안 되면, 그 장비의 루트 인증서를 내보내 이 폴더에
  #                 두고 파일 이름을 적으세요. 전산팀에 "사내 SSL 검사 장비의
  #                 루트 인증서 PEM" 이라고 하면 받을 수 있습니다.
  #   false         검사하지 않습니다. 마지막 수단입니다. 읽기만 하는 공개
  #                 게시판이라 넘기는 값은 없지만, 받아온 내용이 진짜 그
  #                 사이트 것인지 보증할 수 없게 됩니다.
  인증서: 자동

게시판:

  # 1단계 대상. 나라장터 27건 중 검토 등급이 0건인데 자체 사이트에만 3건이
  # 있었다. 채널이 갈린 것이지 표본 오차가 아니다.
  - 이름: 중소기업중앙회
    기관: 중소기업중앙회
    사용: true
    목록: "https://www.kbiz.or.kr/ko/contents/bbs/list.do?mnSeq=211&pg=1&pgSz=30"
    # goView(163784, 'N') 에서 번호와 '공지 고정' 표시를 둘 다 뽑는다.
    # 공지로 고정된 글은 topFixYn=Y 로 열어야 하고, N 으로 열면 목록으로 튕긴다.
    상세: "https://www.kbiz.or.kr/ko/contents/bbs/view.do?seq={번호}&topFixYn={고정}&mnSeq=211"
    번호찾기: "goView\\((?P<번호>\\d+),\\s*'(?P<고정>[YN])'"
    제목칸: 1
    날짜칸: -1
    # 이 게시판은 입찰공고와 그 결과가 한 곳에 섞여 올라온다.
    # 결과는 이미 끝난 건이라 우리가 할 일이 없다.
    제목제외:
      - "평가\\s*결과"
      - "선정\\s*결과"
      - "심사\\s*결과"
      - "낙찰"
      - "유찰"
      - "결과\\s*공고"
