# ============================================================
#  나라장터 공고 수집 설정 — 견본
#
#  이 파일은 손대지 마세요. config.yaml 이 망가졌을 때 되돌릴 원본입니다.
#
#  config.yaml 이 없거나 되돌려야 하면
#    1. 이 파일을 같은 폴더에 복사합니다
#    2. 이름을 config.yaml 로 바꿉니다
#    3. 편집기.bat 을 더블클릭해 인증키와 받는 사람을 채웁니다
#
#  설정은 편집기.bat 으로 고치는 것이 안전합니다. 자세한 내용은
#  README.md 의 3-0 절을 보세요.
# ============================================================

# 공공데이터포털(data.go.kr) 인증키.
# Encoding / Decoding 어느 쪽을 넣어도 자동으로 처리합니다.
#
# ※ 인증키는 쓰는 PC마다 따로 발급받으세요.
#   호출 한도가 키 단위로 걸려서, 같은 키를 두 사람이 쓰면
#   한쪽이 한도를 다 쓴 날 다른 쪽도 같이 멈춥니다.
service_key: ''

# 최근 몇 시간 이내 공고를 볼지
#
# 넉넉하게 잡는 것이 맞습니다. 이미 보낸 건은 _수집이력.json 이 걸러내므로
# 겹쳐서 조회해도 메일에는 새 공고만 나옵니다.
#
# 168 = 7일. 오전 10시 / 오후 4시 두 번, 주말은 쉬는 일정 기준입니다.
#   - 12 로 두면 전날 16시~22시 6시간이 어느 실행에도 안 들어갑니다
#   - 금요일 16시 다음이 월요일 10시라 주말에 66시간이 빕니다
#   - 여기에 공휴일이 끼면 90시간이 넘습니다
# 7일치를 매번 훑으면 주말·연휴·PC 꺼짐에 전부 안전합니다.
hours: 168

# 조회할 업무구분 (용역 / 물품 / 공사)
targets:
  - 용역
  # - 물품
  # - 공사

# 무조건 수집할 업종코드. 3865 = 채권평가회사
industry_codes:
  - '3865'

# ------------------------------------------------------------
#  대상 기관  ―  금융기관(공제회 + 연기금 + 금융공공기관)
#
#  이름의 일부만 적으면 됩니다. '공제회' 하나로 군인공제회,
#  행정공제회, 교직원공제회가 모두 걸립니다.
#
#  공고기관과 수요기관을 모두 검사합니다.
#  조달청 대행 공고는 공고기관이 '조달청'이고 실제 발주처는
#  수요기관에 들어가므로, 둘 다 봐야 놓치지 않습니다.
#
#  ※ 여기 있으면 버리지 않고 +3점을 주는 가점입니다. 목록에 없어도
#    공고명 점수가 높으면 수집됩니다. 그래서 한국벤처투자·전파진흥원처럼
#    목록에 없던 기금 운용기관 공고도 잡힙니다.
#    배점은 점수표.yaml 의 inst_bonus 에서 조정합니다.
# ------------------------------------------------------------
institutions:
  # --- 연기금 ---
  - 국민연금공단
  - 공무원연금공단
  - 사립학교교직원연금공단
  - 한국투자공사

  # --- 공제회 (부분일치 한 줄로 전부 커버) ---
  - 공제회

  # --- 중앙회 ---
  - 새마을금고중앙회
  - 신협중앙회
  - 수산업협동조합중앙회
  - 농업협동조합중앙회

  # --- 금융공공기관 ---
  - 한국은행
  - 금융감독원
  - 예금보험공사
  - 한국산업은행
  - 중소기업은행
  - 한국수출입은행
  - 한국자산관리공사
  - 한국주택금융공사
  - 주택도시보증공사
  - 서민금융진흥원
  - 신용보증기금
  - 기술보증기금
  - 한국무역보험공사
  - 한국예탁결제원
  - 한국거래소
  - 금융결제원
  - 한국증권금융
  - 우정사업본부

# ------------------------------------------------------------
#  문턱을 낮춰 보는 기관  ―  연기금 · 공제회
#
#  위 institutions 는 +3점 가점만 줍니다. 여기 있는 기관은 거기에 더해
#  검토(C) 문턱이 7점이 아니라 5점입니다. (점수표.yaml 의 cut_review_low)
#
#  '자산운용 컨설팅' '기준 포트폴리오 도입' 처럼 확정어가 없어 5~6점에
#  머무는 공고가 이 기관들에서는 실제로 우리 일인 경우가 있어서입니다.
#
#  ※ 금융공공기관까지 넓히지 마세요. 4개월 기준 14건이 77건이 되고
#    그 대부분이 뉴스 모니터링·장비 교체·감정평가 같은 무관한 공고입니다.
# ------------------------------------------------------------
institutions_low_cut:
  - 국민연금공단
  - 공무원연금공단
  - 사립학교교직원연금공단
  - 한국투자공사
  - 공제회

# 결과 저장 폴더
# 네트워크 폴더 예시:  '\\파일서버\공유\조달\공고수집'
output_dir: './수집결과'

# ------------------------------------------------------------
#  메일 공지
#
#  수집이 끝나면 그 회차에 새로 잡힌 공고를 메일 '본문 표'로 보냅니다.
#  엑셀을 열지 않고도 메일에서 바로 확인할 수 있습니다.
#
#  오전/오후 두 번 공지하려면 작업 스케줄러에 두 번 등록하고
#  hours: 12 로 두면 됩니다. 제목에 오전/오후가 자동으로 붙습니다.
#
#  발송만 시험하려면  python 수집기.py --메일만
#  (수집을 다시 하지 않고 엑셀의 마지막 회차를 그대로 보냅니다)
# ------------------------------------------------------------
mail:
  enabled: false         # 주소를 채운 뒤 true 로 바꾸세요

  # outlook : 이 PC에 설치된 아웃룩으로 보냅니다. 서버 정보가 필요 없고
  #           로그인한 본인 계정으로 나갑니다. pip install pywin32 필요.
  # smtp    : 사내 메일 서버로 직접 보냅니다. 아래 smtp 항목을 채우세요.
  mode: outlook

  # 받는 사람. 테스트 단계에는 담당자 한 명만 넣습니다.
  to:
    - '담당자@회사.co.kr'
  cc: []

  # 오류 메일 받는 사람. 조회가 실패한 회차에만 나갑니다.
  #
  # 업무 담당자에게 API 오류 메일이 가면 안 읽습니다. 수집기를 손볼 수 있는
  # 사람(IT 담당자·개발 담당자)을 넣으세요. 비워두면 위 to 로 갑니다.
  error_to: []

  # ----------------------------------------------------------
  #  메일 문구 ― 여기만 고치면 메일 내용이 바뀝니다 (파이썬 안 건드림)
  #
  #  {중괄호} 는 보낼 때 값으로 바뀝니다. 쓸 수 있는 것:
  #    {날짜}  08.13(오전)
  #    {건수}  13
  #    {내역}  수집 9건 · 검토 4건
  #    {시각}  2026.08.13 09:00
  #    {기간}  조회기간 08.12 21:00 ~ 08.13 09:00
  #    {폴더}  결과가 저장된 경로
  #    {빠짐}  용역 08.12 09:00~08.13 09:00  (실패알림에서만)
  #  항목마다 쓸 수 있는 것이 다릅니다(아래 주석 참고).
  #  없는 이름을 쓰면 그 줄만 기본 문구로 나가고 화면에 알려줍니다.
  #
  #  ※ 줄 전체를 작은따옴표로 감싸세요. 안에 작은따옴표를 쓰려면 두 번('')
  #  ※ 항목을 지우거나 비워두면 기본 문구가 쓰입니다
  # ----------------------------------------------------------
  문구:
    # 공고가 있을 때        — {날짜} {건수} {내역}
    제목: '[나라장터] {날짜} 신규 {건수}건 ({내역})'
    # 공고가 없을 때        — {날짜}
    제목_없음: '[나라장터] {날짜} 입찰 공고 특이사항 없습니다'
    # 조회가 일부 실패했을 때 — {날짜} {건수} {내역}
    #   0건이어도 '없습니다' 라고 하면 안 됩니다. 못 본 것일 수 있습니다.
    제목_일부: '[나라장터] {날짜} 신규 {건수}건 ({내역}) — 일부 조회 실패'
    # 조회가 통째로 실패했을 때 — {날짜}  (오류 메일 제목. error_to 로 갑니다)
    제목_실패: '[나라장터] {날짜} 자동수집 실패 — 확인 필요'
    # 일부 실패했을 때 본문 맨 위에 붙는 경고 — {빠짐}
    실패알림: |-
      이번 회차는 조회가 완전하지 않았습니다. 아래 목록에 빠진 공고가 있을 수 있습니다.
      못 받은 구간: {빠짐}

    # 본문 첫 줄            — {시각} {기간}
    첫줄: '{시각} 기준 나라장터 신규 공고입니다. ({기간})'
    # 표 바로 위 요약       — {건수} {내역}
    요약: '총 {건수}건 — {내역}'
    # 공고가 없을 때 본문   — {날짜}  (이 한 줄만 나가고 첨부도 없습니다)
    없음: '{날짜} 나라장터 입찰 공고 특이사항 없습니다.'

    # 표 아래 안내. 줄을 나누려면 여러 줄로 쓰면 됩니다.
    안내: |-
      공고명을 누르면 나라장터 공고 화면이 열립니다.
      A = 시가/대체 평가 및 채권평가회사(업종코드) 키워드 일치 · B = 키워드 일부 일치 · C = 기금/공제회 관련, 검토 필요 공고 (회색 줄)
    # C가 있을 때만 덧붙는 안내
    검토안내: 'C는 자격요건에 채권평가회사 표기가 없어 판정이 애매한 건입니다. 공고문을 열어 확인이 필요합니다.'
    # 맨 아래 작은 글씨     — {폴더}
    꼬리말: '자동 발송 메일입니다. 원본 파일 위치: {폴더}'

  # true 로 두면 보내지 않고 아웃룩에 초안만 띄웁니다.
  # 내용을 눈으로 확인하고 직접 보내고 싶을 때 (테스트 단계 권장).
  draft_only: true

  attach_excel: false      # 공고목록.xlsx 를 참고용으로 첨부
  attach_pdf: false        # 메일 표에 오른 공고의 공고문 PDF 도 첨부
  attach_max_mb: 15       # 첨부 총 용량 상한. 넘으면 뒤쪽은 안 붙입니다
  # 신규 0건일 때도 보낼지. true 면 '08.13(오전) 나라장터 입찰 공고
  # 특이사항 없습니다.' 한 줄만 나갑니다(첨부 없음).
  # 안 보내면 받는 쪽에서 '공고가 없었다' 와 '수집기가 죽었다' 를 구분할 수
  # 없으므로 켜두는 편이 안전합니다.
  send_when_empty: true

  # mode: smtp 일 때만 씁니다. 값은 IT 부서에서 받아야 합니다.
  smtp:
    host: ''              # 예: mail.회사.co.kr
    port: 25              # 릴레이 25 / 인증 587
    tls: false
    user: ''              # 인증이 필요 없으면 비워둡니다
    password: ''
    from: ''              # 발신 주소 (예: 나라장터알림@회사.co.kr)
